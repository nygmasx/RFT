# fly.toml app configuration file generated for roninft on 2026-06-16T17:16:49+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rfteam'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Authentication happens during app startup: keep one instance warm so the
  # first member opening the app does not pay the server cold-start penalty.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
