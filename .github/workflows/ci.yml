name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rft_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rft_test
      BETTER_AUTH_SECRET: ci-integration-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.6.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix server

      - name: Typecheck, lint and test
        run: npm run check

      - name: Create integration database schema
        run: npm --prefix server run db:push -- --force

      - name: Run API integration tests
        run: npm --prefix server run test:integration

      - name: Verify Expo SDK 56 dependencies
        run: npx expo install --check

      - name: Build the web application
        run: npx expo export --platform web --output-dir dist
